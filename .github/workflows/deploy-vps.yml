name: Deploy VPS Hostinger

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Build e Deploy no VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build (preset node)
        env:
          NITRO_PRESET: node
          NODE_ENV: production
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID || vars.VITE_GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID || vars.GOOGLE_CLIENT_ID }}
        shell: bash
        run: |
          if [ -z "$VITE_GOOGLE_CLIENT_ID" ]; then
            echo "::error::Configure VITE_GOOGLE_CLIENT_ID in GitHub Actions secrets or variables before deploying."
            exit 1
          fi
          npm run build

      - name: Instalar navegador de teste
        run: npx playwright install --with-deps chromium

      - name: Validar cadastro na build de produção
        run: npm run test:cadastro

      - name: Compactar artefatos de deploy
        run: |
          tar -czf deploy.tar.gz \
            .output/ \
            package.json \
            package-lock.json \
            ecosystem.config.cjs \
            scripts/list-users.mjs

      - name: Copiar artefatos para o VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: deploy.tar.gz
          target: /tmp/brasiltec

      - name: Deploy e reiniciar app no VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            APP_DIR=/var/www/brasiltec-producao
            BACKUP_DIR=/var/www/brasiltec-backup
            SQLITE_DB="$APP_DIR/.data/brasiltec.sqlite"

            # Preserve the existing SQLite database before changing the active backend.
            if [ ! -f "$SQLITE_DB" ]; then
              echo "SQLite database not found: $SQLITE_DB"
              exit 1
            fi
            node - "$SQLITE_DB" <<'NODE'
            const { DatabaseSync } = require("node:sqlite");
            const database = new DatabaseSync(process.argv[2], { readOnly: true });
            try {
              const hasUsers = database
                .prepare("SELECT 1 FROM sqlite_master WHERE type = ? AND name = ?")
                .get("table", "users");
              if (!hasUsers) {
                throw new Error("The selected SQLite database has no users table.");
              }
              const { total } = database
                .prepare("SELECT COUNT(*) AS total FROM users")
                .get();
              if (total < 1) {
                throw new Error("The selected SQLite database contains no users.");
              }
              console.log(`Validated SQLite database with ${total} users.`);
            } finally {
              database.close();
            }
            NODE
            mkdir -p "$BACKUP_DIR"
            BACKUP_FILE="$BACKUP_DIR/brasiltec-sqlite-$(date -u +%Y%m%dT%H%M%SZ).tar.gz"
            tar -czf "$BACKUP_FILE" -C "$APP_DIR" .data
            chmod 600 "$BACKUP_FILE"

            # Descompactar artefatos
            mkdir -p $APP_DIR
            tar -xzf /tmp/brasiltec/deploy.tar.gz -C $APP_DIR
            rm -rf /tmp/brasiltec

            # Instalar dependências de produção
            cd $APP_DIR
            npm ci --omit=dev

            # Reiniciar via PM2 (instala se necessário)
            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
            fi

            pm2 startOrRestart ecosystem.config.cjs --env production --update-env
            pm2 save

            echo "✅ Deploy concluído com sucesso!"
