name: Smoke Sprint A

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  smoke-sprint-a:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          NITRO_PRESET: node
          NODE_ENV: production

      - name: Verify server artifact
        run: |
          if [ ! -f dist/server/server.js ]; then
            echo "ERROR: dist/server/server.js not found after build. Build output:"
            find dist -type f | sort || true
            exit 1
          fi
          echo "dist/server/server.js found — OK"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Sprint A smoke
        run: npx playwright test -c playwright.smoke.config.ts
        env:
          NITRO_PRESET: node
          SKIP_COMMERCE_SMOKES: "1"

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
